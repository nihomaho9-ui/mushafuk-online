ass="tx" lang="si">නුඹලාට ආගන්තුක සත්කාර වශයෙන් සූදානම් කරන ලද පරමාධිපතිගෙන් වූ සංග්රහයක් වශයෙනි. තම ගැත්තන් අතරින් කවරෙකු පාපක්ෂමාව අයැද ඔහු වෙත යොමු වන්නේ ද ඔවුන්ගේ පාපයන්ට සමාව දෙන්නාය. ඔවුන් කෙරෙහි කරුණාව දක්වන්නාය.</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/si/41/31/">පෙර ආයත්</a><a href="/tafsir/tercume/mukhtasar/si/41/33/">ඊළඟ ආයත්</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/si/41/33/" data-prev="/tafsir/tercume/mukhtasar/si/41/31/"></script></body></html>

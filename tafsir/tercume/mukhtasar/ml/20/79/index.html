<div class="tx" lang="ml">ഫിർഔൻ അവൻ്റെ ജനതയെ (അല്ലാഹുവിനെ) നിഷേധിക്കുന്നത് ഭംഗിയാക്കി തോന്നിപ്പിച്ചു കൊണ്ട് വഴികേടിലാക്കി. അസത്യങ്ങൾ കൊണ്ട് അവനവരെ വഞ്ചിക്കുകയും ചെയ്തു. അവൻ അവരെ സത്യത്തിൻ്റെ പാതയിലേക്ക് നയിച്ചതുമില്ല.</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/ml/20/78/">മുൻ ആയത്ത്</a><a href="/tafsir/tercume/mukhtasar/ml/20/80/">അടുത്ത ആയത്ത്</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/ml/20/80/" data-prev="/tafsir/tercume/mukhtasar/ml/20/78/"></script></body></html>

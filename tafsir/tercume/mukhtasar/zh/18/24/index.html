ar/zh/18/23/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/18/25/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/18/25/" data-prev="/tafsir/tercume/mukhtasar/zh/18/23/"></script></body></html>

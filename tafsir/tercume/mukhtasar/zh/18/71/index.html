。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/18/70/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/18/72/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/18/72/" data-prev="/tafsir/tercume/mukhtasar/zh/18/70/"></script></body></html>

主，不以此称呼除清高的真主外的任何人或物。（2）الرحمن “至仁主”意为：拥有广阔无垠的仁慈之主，祂亦是至仁主。（3）الرحيم “至慈的主”意为：拥有广阔的恩慈之主。祂将自己的恩慈赐予祂所意欲的被造物，以及众仆中的信民们。</div><nav class="pn"><span></span><a href="/tafsir/tercume/mukhtasar/zh/1/2/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/1/2/" data-prev=""></script></body></html>

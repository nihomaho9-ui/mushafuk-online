"zh">如果穆斯林驱逐了犹太人，那些人绝不会和他们一起离家，如果穆斯林袭击犹太人，他们也不会援助和支援他们，如果犹太人向他们请求支援对付穆斯林，他们必逃之夭夭，然后，在这之后伪信者绝不受援助，真主使他们成为卑贱的和受辱的。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/59/11/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/59/13/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/59/13/" data-prev="/tafsir/tercume/mukhtasar/zh/59/11/"></script></body></html>

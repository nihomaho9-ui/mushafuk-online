物。你们将会像大地上生出谷物一样从坟墓中出来，以便接受清算和报酬。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/30/18/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/30/20/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/30/20/" data-prev="/tafsir/tercume/mukhtasar/zh/30/18/"></script></body></html>

<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — النساء 160 | Mushafuk.online</title><meta name="description" content="因犹太教徒的不义，我禁止他们享用一些曾对他们是合法的佳美食物。故我禁止他们食用有爪的动物，以及牛和羊的脂油，惟牛羊脊上的脂油除外。又因他们自己不去也阻挡别人遵循正道，以至于拒绝行善已成为他们的惯性。"><meta property="og:title" content="简明古兰经注 — النساء 160 | Mushafuk.online"><meta property="og:description" content="因犹太教徒的不义，我禁止他们享用一些曾对他们是合法的佳美食物。故我禁止他们食用有爪的动物，以及牛和羊的脂油，惟牛羊脊上的脂油除外。又因他们自己不去也阻挡别人遵循正道，以至于拒绝行善已成为他们的惯性。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/4/160/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/4/159/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/4/161/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>النساء</b><small>节 160</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">فَبِظُلْمٍ مِّنَ ٱلَّذِينَ هَادُوا۟ حَرَّمْنَا عَلَيْهِمْ طَيِّبَـٰتٍ أُحِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَن سَبِيلِ ٱللَّهِ كَثِيرًا ﴿١٦٠﴾</p><div class="tx" lang="zh">因犹太教徒的不义，我禁止他们享用一些曾对他们是合法的佳美食物。故我禁止他们食用有爪的动物，以及牛和羊的脂油，惟牛羊脊上的脂油除外。又因他们自己不去也阻挡别人遵循正道，以至于拒绝行善已成为他们的惯性。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/4/159/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/4/161/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/4/161/" data-prev="/tafsir/tercume/mukhtasar/zh/4/159/"></script></body></html>

教，并遵循非信士的道路，那么，我将放弃他，任其随波逐流，我会因他故意拒绝而不给予他真理。我将使他进入火狱，那归宿真恶劣。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/4/114/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/4/116/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/4/116/" data-prev="/tafsir/tercume/mukhtasar/zh/4/114/"></script></body></html>

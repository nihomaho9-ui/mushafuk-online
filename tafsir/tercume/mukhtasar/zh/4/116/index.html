<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — النساء 116 | Mushafuk.online</title><meta name="description" content="真主确不饶恕以物配主者，祂会使他进入火狱。真主以祂的仁慈和恩惠饶恕祂所意欲之人的除以物配主外的其它罪行。谁以物配主，他已彻底远离了真理，因为他将创造者和被造者视为等同。"><meta property="og:title" content="简明古兰经注 — النساء 116 | Mushafuk.online"><meta property="og:description" content="真主确不饶恕以物配主者，祂会使他进入火狱。真主以祂的仁慈和恩惠饶恕祂所意欲之人的除以物配主外的其它罪行。谁以物配主，他已彻底远离了真理，因为他将创造者和被造者视为等同。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/4/116/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/4/115/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/4/117/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><h1 style="margin:0;font-size:1.15rem;font-weight:700;line-height:1.3;color:#1a3330"><b>النساء</b></h1><small>节 116</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">إِنَّ ٱللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِۦ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَآءُ ۚ وَمَن يُشْرِكْ بِٱللَّهِ فَقَدْ ضَلَّ ضَلَـٰلًۢا بَعِيدًا ﴿١١٦﴾</p><div class="tx" lang="zh">真主确不饶恕以物配主者，祂会使他进入火狱。真主以祂的仁慈和恩惠饶恕祂所

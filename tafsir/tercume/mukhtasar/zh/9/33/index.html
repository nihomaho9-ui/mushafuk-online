据，使伊斯兰超越任何宗教，即使以物配主者对此不悦。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/9/32/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/9/34/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/9/34/" data-prev="/tafsir/tercume/mukhtasar/zh/9/32/"></script></body></html>

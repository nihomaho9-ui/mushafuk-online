头为其祈求恕饶。那是因为他们否认真主和其使者，他们在不信道的情况下死去。谁如此，就不要为其举行殡礼并为他祈求恕饶。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/9/83/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/9/85/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/9/85/" data-prev="/tafsir/tercume/mukhtasar/zh/9/83/"></script></body></html>

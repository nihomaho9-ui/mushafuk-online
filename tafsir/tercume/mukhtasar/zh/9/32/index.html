<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — التوبة 32 | Mushafuk.online</title><meta name="description" content="这些不信道者和他们不信道的宗族们企图用诽谤和谎言来消灭和推翻伊斯兰，企图推翻建立在明证和证据上的认主独一，以及使者带来的真理。真主完善、彰显并抬高其宗教，即使不信道者不愿如此。的确，真主是完善者、彰显者和抬高者。真主如意欲某事，必摧毁其反对者的能力。"><meta property="og:title" content="简明古兰经注 — التوبة 32 | Mushafuk.online"><meta property="og:description" content="这些不信道者和他们不信道的宗族们企图用诽谤和谎言来消灭和推翻伊斯兰，企图推翻建立在明证和证据上的认主独一，以及使者带来的真理。真主完善、彰显并抬高其宗教，即使不信道者不愿如此。的确，真主是完善者、彰显者和抬高者。真主如意欲某事，必摧毁其反对者的能力。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/9/32/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/9/31/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/9/33/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>التوبة</b><small>节 32</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">يُرِيدُونَ أَن يُطْفِـُٔوا۟ نُورَ ٱللَّهِ بِأَفْوَٰهِهِمْ وَيَأْبَى ٱللَّهُ إِلَّآ أَن يُتِمَّ نُورَهُۥ وَلَوْ كَرِهَ ٱلْكَـٰفِرُونَ ﴿٣٢﴾</p><div class="tx" lang="zh">这些不信道者和他们不信道的宗族们企图用诽谤和谎言来消灭和推翻伊斯兰，企图推翻建立在明证和证据上的认主独一，以及使者带来的真理。真主完善、彰显并抬高其宗教，即使不信道者不愿如此。的确，真主是完善者、彰显者和抬高者。真主如意欲某事，必摧毁其反对者的能力。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/9/31/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/9/33/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/9/33/" data-prev="/tafsir/tercume/mukhtasar/zh/9/31/"></script></body></html>

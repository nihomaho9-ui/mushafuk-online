易卜拉欣的后裔，使圣品保留在其子嗣之中；同样，祂也拣选了仪姆兰的后裔，真主拣选了这些人，并使他们超越同时代的人们。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/3/32/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/3/34/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/3/34/" data-prev="/tafsir/tercume/mukhtasar/zh/3/32/"></script></body></html>

。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/2/170/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/2/172/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/2/172/" data-prev="/tafsir/tercume/mukhtasar/zh/2/170/"></script></body></html>

<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — البقرة 37 | Mushafuk.online</title><meta name="description" content="阿丹接受了从其养主那里学到的祷词，真主启示他以此作为祈祷，即《古兰经》中所记述的祈祷词。阿丹和妻子说：“我们的养主啊！我们确已自亏，如果你不饶恕我们，不怜悯我们，那么我们必成折本之人。”（高处章：23）因此，真主接受了他俩的忏悔，饶恕了他俩的过错。真主是至恕的主、至慈的主。"><meta property="og:title" content="简明古兰经注 — البقرة 37 | Mushafuk.online"><meta property="og:description" content="阿丹接受了从其养主那里学到的祷词，真主启示他以此作为祈祷，即《古兰经》中所记述的祈祷词。阿丹和妻子说：“我们的养主啊！我们确已自亏，如果你不饶恕我们，不怜悯我们，那么我们必成折本之人。”（高处章：23）因此，真主接受了他俩的忏悔，饶恕了他俩的过错。真主是至恕的主、至慈的主。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/2/37/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/2/36/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/2/38/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><h1 style="margin:0;font-size:1.15rem;font-weight:700;line-height:1.3;color:#1a3330"><b>البقرة</b></h1><small>节 37</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">فَتَلَقَّىٰٓ ءَادَمُ مِن رَّبِّهِۦ كَلِمَـٰتٍ فَتَابَ عَلَيْهِ ۚ إِنَّهُۥ هُوَ ٱلتَّوَّابُ ٱلرَّحِيمُ ﴿٣٧﴾</p><div class="tx" lang="zh">阿丹接受了从其养主那里学到的祷词，真主启示他以此作为祈祷，即《古兰经》中所记述的祈祷词。阿丹和妻子说：“我们的养主啊！我们确已自亏，如果你不饶恕我们，不怜悯我们，那么我们必成折本之人。”（高处章：23）因此，真主接受了他俩的忏悔，饶恕了他俩的过错。真主是至恕的主、至慈的主。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/2/36/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/2/38/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/2/38/" data-prev="/tafsir/tercume/mukhtasar/zh/2/36/"></script></body></html>

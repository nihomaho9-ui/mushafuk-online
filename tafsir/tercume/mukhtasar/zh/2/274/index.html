<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — البقرة 274 | Mushafuk.online</title><meta name="description" content="为追求真主喜悦，在昼夜间秘密或公开施舍财产之人，他们不沽名钓誉，不为声誉而施舍，在后世将得到真主的回赐。他们不恐惧将要发生之事，对今世失去的事物也毫不忧愁，他们将得到真主的恩典与恩惠。"><meta property="og:title" content="简明古兰经注 — البقرة 274 | Mushafuk.online"><meta property="og:description" content="为追求真主喜悦，在昼夜间秘密或公开施舍财产之人，他们不沽名钓誉，不为声誉而施舍，在后世将得到真主的回赐。他们不恐惧将要发生之事，对今世失去的事物也毫不忧愁，他们将得到真主的恩典与恩惠。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/2/274/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/2/273/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/2/275/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>البقرة</b><small>节 274</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُم بِٱلَّيْلِ وَٱلنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ﴿٢٧٤﴾</p><div class="tx" lang="zh">为追求真主喜悦，在昼夜间秘密或公开施舍财产之人，他们不沽名钓誉，不为声誉而施舍，在后世将得到真主的回赐。他们不恐惧将要发生之事，对今世失去的事物也毫不忧愁，他们将得到真主的恩典与恩惠。</div

05/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/2/207/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/2/207/" data-prev="/tafsir/tercume/mukhtasar/zh/2/205/"></script></body></html>

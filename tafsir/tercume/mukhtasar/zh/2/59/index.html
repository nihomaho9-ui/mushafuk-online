逆而降给他们无可逃避的灾难。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/2/58/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/2/60/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/2/60/" data-prev="/tafsir/tercume/mukhtasar/zh/2/58/"></script></body></html>

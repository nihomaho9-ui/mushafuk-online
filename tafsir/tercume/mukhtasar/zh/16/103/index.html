<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — النحل 103 | Mushafuk.online</title><meta name="description" content="我知道以物配主者将说：“《古兰经》只是一个凡人传授给穆罕默德的”，他们在说谎。他们所妄称的那个人非阿拉伯人，而这部《古兰经》是高雅的、明确的阿拉伯语，他们怎么会妄称是一个非阿拉伯人教授他的呢？"><meta property="og:title" content="简明古兰经注 — النحل 103 | Mushafuk.online"><meta property="og:description" content="我知道以物配主者将说：“《古兰经》只是一个凡人传授给穆罕默德的”，他们在说谎。他们所妄称的那个人非阿拉伯人，而这部《古兰经》是高雅的、明确的阿拉伯语，他们怎么会妄称是一个非阿拉伯人教授他的呢？"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/16/103/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/16/102/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/16/104/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>النحل</b><small>节 103</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">وَلَقَدْ نَعْلَمُ أَنَّهُمْ يَقُولُونَ إِنَّمَا يُعَلِّمُهُۥ بَشَرٌ ۗ لِّسَانُ ٱلَّذِى يُلْحِدُونَ إِلَيْهِ أَعْجَمِىٌّ وَهَـٰذَا لِسَانٌ عَرَبِىٌّ مُّبِينٌ ﴿١٠٣﴾</p><div class="tx" lang="zh">我知道以物配主者将说：“《古兰经》只是一个凡人传授给穆罕默德的”，他们在说谎。他们所妄称的那个人非阿拉伯人，而这部《古兰经》是高雅的、明确的阿拉伯语，他们怎么会妄称是一个非阿拉伯人教授他的呢？</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/16/102/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/16/104/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/16/104/" data-prev="/tafsir/tercume/mukhtasar/zh/16/102/"></script></body></html>

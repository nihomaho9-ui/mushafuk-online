" lang="zh">在我赐予你们的椰枣和葡萄中对你们确有一种教训。你们从中酿造醉人的酒，而这并非美好的事物。你们从中制造出有益于你们的美好的给养。如椰枣、葡萄干、酸葡萄汁和糖浆。这为能理解的民众证明了真主的大能和它赐予仆人的恩惠，他们是善于思考的人。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/16/66/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/16/68/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/16/68/" data-prev="/tafsir/tercume/mukhtasar/zh/16/66/"></script></body></html>

空中被制服的鸟吗？真主赐予鸟翅膀和能使其飞翔的空气，启示它们收缩和展开羽翼。只有全能的真主能使它们在空中飞翔而不坠地。对于信道的民众，此中确有许多迹象，因为他们能从中获益。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/16/78/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/16/80/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/16/80/" data-prev="/tafsir/tercume/mukhtasar/zh/16/78/"></script></body></html>

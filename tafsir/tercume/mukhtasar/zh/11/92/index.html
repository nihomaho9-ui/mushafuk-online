x" lang="zh">舒阿卜对他的族人说：“我的族人啊！难道我的家族对于你们比真主还尊贵吗？你们把真主当作背后的弃物，你们不信仰他派给你们的先知，我的主是彻知你们的行为的。你们的任何工作都瞒不过祂。在今世，祂将因你们的行为而毁灭你们。在后世，祂将惩罚你们。”</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/11/91/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/11/93/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/11/93/" data-prev="/tafsir/tercume/mukhtasar/zh/11/91/"></script></body></html>

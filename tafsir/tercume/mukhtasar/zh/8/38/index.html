因为加入伊斯兰可以抹去之前的过错。如果他们重蹈覆辙，那么，真主在先前民族中也有先例，如果执迷不悟，真主也会对他们施以惩罚。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/8/37/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/8/39/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/8/39/" data-prev="/tafsir/tercume/mukhtasar/zh/8/37/"></script></body></html>

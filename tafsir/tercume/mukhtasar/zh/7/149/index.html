="zh">当他们后悔并知道自己将牛犊视为神灵而崇拜确已迷失了正道时，他们转向真主，并祈求道：“如果我们的养主不以佑助我们顺从祂而怜悯我们，不以我们曾崇拜牛犊而原谅我们，那我们必定成为今后两世中的亏折之人。”</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/7/148/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/7/150/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/7/150/" data-prev="/tafsir/tercume/mukhtasar/zh/7/148/"></script></body></html>

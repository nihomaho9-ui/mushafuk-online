的悖逆之人，我降下洪水淹没他们以示惩罚，他们的心对真理确是盲的。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/7/63/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/7/65/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/7/65/" data-prev="/tafsir/tercume/mukhtasar/zh/7/63/"></script></body></html>

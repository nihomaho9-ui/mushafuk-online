绘出的眼睛面对你们，它们是一些无法观看的无生物。他们曾做出一些人形或动物形态的雕像，并为这些雕像雕出手、脚和眼睛，但是它们都是无生物，没有生命也不会动。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/7/197/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/7/199/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/7/199/" data-prev="/tafsir/tercume/mukhtasar/zh/7/197/"></script></body></html>

<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — الأعراف 31 | Mushafuk.online</title><meta name="description" content="阿丹的子孙啊！当你们礼拜和巡游天房时，应遮盖羞体，应以洁净的衣物美化自己。你们可以随意吃、喝那些真主为你们定为合法的佳美食物，但不要过分，你们不要将合法的视为非法的，真主的确不喜欢僭越公正法度之人。"><meta property="og:title" content="简明古兰经注 — الأعراف 31 | Mushafuk.online"><meta property="og:description" content="阿丹的子孙啊！当你们礼拜和巡游天房时，应遮盖羞体，应以洁净的衣物美化自己。你们可以随意吃、喝那些真主为你们定为合法的佳美食物，但不要过分，你们不要将合法的视为非法的，真主的确不喜欢僭越公正法度之人。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/7/31/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/7/30/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/7/32/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>الأعراف</b><small>节 31</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">يَـٰبَنِىٓ ءَادَمَ خُذُوا۟ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍ وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟ ۚ إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْرِفِينَ ﴿٣١﴾</p><div class="tx" lang="zh">阿丹的子孙啊！当你们礼拜和巡游天房时，应遮盖羞体，应以洁净的衣物美化自己。你们可以随意吃、喝那些真主为你们定为合法的佳美食物，但不要过分，你们不要将合法的视为非法的，真主的确不喜欢僭越公正法度之人。</div><nav

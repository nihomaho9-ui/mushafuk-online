<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — الأعراف 94 | Mushafuk.online</title><meta name="description" content="我为每一个村庄都派去了先知，但它的村民们都加以否认并且都不相信。除非为使他们谦逊，我为他们降下忧愁、贫穷和疾病以示惩戒，那他们才会放弃以往的悖逆和傲慢。这是对古莱氏的警告，也是对所有不信道的以及否认真主常道的宗族的警告。"><meta property="og:title" content="简明古兰经注 — الأعراف 94 | Mushafuk.online"><meta property="og:description" content="我为每一个村庄都派去了先知，但它的村民们都加以否认并且都不相信。除非为使他们谦逊，我为他们降下忧愁、贫穷和疾病以示惩戒，那他们才会放弃以往的悖逆和傲慢。这是对古莱氏的警告，也是对所有不信道的以及否认真主常道的宗族的警告。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/7/94/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/7/93/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/7/95/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>الأعراف</b><small>节 94</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">وَمَآ أَرْسَلْنَا فِى قَرْيَةٍ مِّن نَّبِىٍّ إِلَّآ أَخَذْنَآ أَهْلَهَا بِٱلْبَأْسَآءِ وَٱلضَّرَّآءِ لَعَلَّهُمْ يَضَّرَّعُونَ ﴿٩٤﴾</p><div class="tx" lang="zh">我为每一个村庄都派去了先知，但它的村民们都加以否认并且都不相信。除非为使他们谦逊，我为他们降下忧愁、贫穷和疾病以示惩戒，那他们才会放弃以往的悖逆和傲慢。这是对古莱氏的警告，也是对所有不信道的以及否认真主常道的宗族的警告。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/7/93/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/7/95/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/7/95/" data-prev="/tafsir/tercume/mukhtasar/zh/7/93/"></script></body></html>

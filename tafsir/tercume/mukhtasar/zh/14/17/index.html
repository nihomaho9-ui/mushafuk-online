<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — إبراهيم 17 | Mushafuk.online</title><meta name="description" content="由于脓汁苦涩、灼热、恶臭，他只能一口一口地喝，几乎难以下咽。由于刑罚的严厉，死亡从各处降临他。但他不会死亡而获得解脱，他将永远受刑，而且还有其它严厉的刑罚等待着他。"><meta property="og:title" content="简明古兰经注 — إبراهيم 17 | Mushafuk.online"><meta property="og:description" content="由于脓汁苦涩、灼热、恶臭，他只能一口一口地喝，几乎难以下咽。由于刑罚的严厉，死亡从各处降临他。但他不会死亡而获得解脱，他将永远受刑，而且还有其它严厉的刑罚等待着他。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/14/17/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/14/16/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/14/18/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>إبراهيم</b><small>节 17</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">يَتَجَرَّعُهُۥ وَلَا يَكَادُ يُسِيغُهُۥ وَيَأْتِيهِ ٱلْمَوْتُ مِن كُلِّ مَكَانٍ وَمَا هُوَ بِمَيِّتٍ ۖ وَمِن وَرَآئِهِۦ عَذَابٌ غَلِيظٌ ﴿١٧﴾</p><div class="tx" lang="zh">由于脓汁苦涩、灼热、恶臭，他只能一口一口地喝，几乎难以下咽。由于刑罚的严厉，死亡从各处降临他。但他不会死亡而获得解脱，他将永远受刑，而且还有其它严厉的刑罚等待着他。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/14/16/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/14/18/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/14/18/" data-prev="/tafsir/tercume/mukhtasar/zh/14/16/"></script></body></html>

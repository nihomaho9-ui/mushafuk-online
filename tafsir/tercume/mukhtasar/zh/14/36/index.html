是我的同道者；谁违抗我，不追随我，也不认主独一，不服从真主，你确是至恕的，你饶恕你所意欲者，你对他们是至慈的。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/14/35/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/14/37/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/14/37/" data-prev="/tafsir/tercume/mukhtasar/zh/14/35/"></script></body></html>

的。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/28/7/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/28/9/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/28/9/" data-prev="/tafsir/tercume/mukhtasar/zh/28/7/"></script></body></html>

赐他们永不间歇的永恒恩典向信仰和顺服之人报喜；以严厉的惩罚向不信道者和犯罪之人提出警告。谁归信众使者，并立行善功，那么，他们对后世将面临的毫无恐惧，对今世中所失去的恩惠也毫无忧愁。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/6/47/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/6/49/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/6/49/" data-prev="/tafsir/tercume/mukhtasar/zh/6/47/"></script></body></html>

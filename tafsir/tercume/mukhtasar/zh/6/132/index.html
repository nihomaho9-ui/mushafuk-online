们。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/6/131/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/6/133/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/6/133/" data-prev="/tafsir/tercume/mukhtasar/zh/6/131/"></script></body></html>

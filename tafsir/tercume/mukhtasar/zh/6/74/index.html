奉吗？我认为你和你崇拜偶像的民众确是处于明显的迷误之中，你们因舍真主而崇拜他物确已偏离了正道，真主才是理应崇拜的主，其它的被崇拜物都是虚假的。”</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/6/73/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/6/75/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/6/75/" data-prev="/tafsir/tercume/mukhtasar/zh/6/73/"></script></body></html>

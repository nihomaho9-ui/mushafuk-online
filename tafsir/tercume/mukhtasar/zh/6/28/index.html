<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — الأنعام 28 | Mushafuk.online</title><meta name="description" content="事实并非他们所说的那样：如果能返回今世，则会信仰。而是暴露出他们内心所隐藏的言辞：指主发誓，我们不曾是以物配主者。当他们见证了自己的所作所为，如果能够重返今世，那他们必定还会故技重施，如果能返回，他们还会背弃信仰。"><meta property="og:title" content="简明古兰经注 — الأنعام 28 | Mushafuk.online"><meta property="og:description" content="事实并非他们所说的那样：如果能返回今世，则会信仰。而是暴露出他们内心所隐藏的言辞：指主发誓，我们不曾是以物配主者。当他们见证了自己的所作所为，如果能够重返今世，那他们必定还会故技重施，如果能返回，他们还会背弃信仰。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/6/28/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/6/27/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/6/29/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>الأنعام</b><small>节 28</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">بَلْ بَدَا لَهُم مَّا كَانُوا۟ يُخْفُونَ مِن قَبْلُ ۖ وَلَوْ رُدُّوا۟ لَعَادُوا۟ لِمَا نُهُوا۟ عَنْهُ وَإِنَّهُمْ لَكَـٰذِبُونَ ﴿٢٨﴾</p><div class="tx" lang="zh">事实并非他们所说的那样：如果能返回今世，则会信仰。而是暴露出他们内心所隐藏的言辞：指主发誓，我们不曾是以物配主者。当他们见证了自己的所作所为，如果能够重返今世，那他们必定还会故技重施，如果能返回，他们还会背弃信仰。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/6/27/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/6/29/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/6/29/" data-prev="/tafsir/tercume/mukhtasar/zh/6/27/"></script></body></html>

<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — طه 131 | Mushafuk.online</title><meta name="description" content="你不要羡慕我使那些否认者享受的今世生活的浮华，那是我对他们的考验，那些浮华是要消失的。你的主所应许的回赐要比他们在今世享受的更好、更长久，因为它是不会消失的。"><meta property="og:title" content="简明古兰经注 — طه 131 | Mushafuk.online"><meta property="og:description" content="你不要羡慕我使那些否认者享受的今世生活的浮华，那是我对他们的考验，那些浮华是要消失的。你的主所应许的回赐要比他们在今世享受的更好、更长久，因为它是不会消失的。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/20/131/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/20/130/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/20/132/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><h1 style="margin:0;font-size:1.15rem;font-weight:700;line-height:1.3;color:#1a3330"><b>طه</b></h1><small>节 131</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَٰجًا مِّنْهُمْ زَهْرَةَ ٱلْحَيَوٰةِ ٱلدُّنْيَا لِنَفْتِنَهُمْ فِيهِ ۚ وَرِزْقُ رَبِّكَ خَيْرٌ وَأَبْقَىٰ ﴿١٣١﴾</p><div class="tx" lang="zh">你不要羡慕我使那些否认者享受的今世生活的浮华，那是我对他们的考验，那些浮

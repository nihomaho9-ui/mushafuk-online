<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — فاطر 9 | Mushafuk.online</title><meta name="description" content="真主派遣风，风起而云动。我将云驱使至一个不毛之地，大地借云中的雨水复活，并在城中生出各类植物。正如我复活了死寂的大地，而且按照我的许诺，在大地上生长了各种植物，在复活日是同样地复活死者。"><meta property="og:title" content="简明古兰经注 — فاطر 9 | Mushafuk.online"><meta property="og:description" content="真主派遣风，风起而云动。我将云驱使至一个不毛之地，大地借云中的雨水复活，并在城中生出各类植物。正如我复活了死寂的大地，而且按照我的许诺，在大地上生长了各种植物，在复活日是同样地复活死者。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/35/9/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/35/8/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/35/10/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><b>فاطر</b><small>节 9</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">وَٱللَّهُ ٱلَّذِىٓ أَرْسَلَ ٱلرِّيَـٰحَ فَتُثِيرُ سَحَابًا فَسُقْنَـٰهُ إِلَىٰ بَلَدٍ مَّيِّتٍ فَأَحْيَيْنَا بِهِ ٱلْأَرْضَ بَعْدَ مَوْتِهَا ۚ كَذَٰلِكَ ٱلنُّشُورُ ﴿٩﴾</p><div class="tx" lang="zh">真主派遣风，风起而云动。我将云驱使至一个不毛之地，大地借云中的雨水复活，并在城中生出各类植物。正如我复活了死寂的大地，而且按照我的许诺，在大地上生长了各种植物，在复活日是同样地复活死者。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/35/8/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/35/10/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/35/10/" data-prev="/tafsir/tercume/mukhtasar/zh/35/8/"></script></body></html>

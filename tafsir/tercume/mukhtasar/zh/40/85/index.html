asar/zh/40/84/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/41/1/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/41/1/" data-prev="/tafsir/tercume/mukhtasar/zh/40/84/"></script></body></html>

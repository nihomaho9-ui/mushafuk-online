<!doctype html><html lang="zh" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简明古兰经注 — الأحقاف 28 | Mushafuk.online</title><meta name="description" content="他们舍真主而遵奉的神灵、以敬拜和献祭接近的偶像，此刻怎么没有援助他们呢？然而，它们绝不能援助他们，更逃离了他们。那是他们自欺的谎言，妄言这些偶像可以使他们受益，并在真主那里替他们说情。"><meta property="og:title" content="简明古兰经注 — الأحقاف 28 | Mushafuk.online"><meta property="og:description" content="他们舍真主而遵奉的神灵、以敬拜和献祭接近的偶像，此刻怎么没有援助他们呢？然而，它们绝不能援助他们，更逃离了他们。那是他们自欺的谎言，妄言这些偶像可以使他们受益，并在真主那里替他们说情。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/46/28/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/46/27/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/zh/46/29/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans SC",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/zh/" aria-label="×">×</a><div class="who"><h1 style="margin:0;font-size:1.15rem;font-weight:700;line-height:1.3;color:#1a3330"><b>الأحقاف</b></h1><small>节 28</small></div></header><main id="tf"><p class="src">简明古兰经注</p><p class="ay" dir="rtl" lang="ar">فَلَوْلَا نَصَرَهُمُ ٱلَّذِينَ ٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ قُرْبَانًا ءَالِهَةًۢ ۖ بَلْ ضَلُّوا۟ عَنْهُمْ ۚ وَذَٰلِكَ إِفْكُهُمْ وَمَا كَانُوا۟ يَفْتَرُونَ ﴿٢٨﴾</p><div class="tx" lang="zh">他们舍真主而遵奉的神灵、以敬拜和献祭接近的偶像，此刻怎么没有援助他们呢？然而，它们绝不能援助他们，更逃离了他们。那是他们自欺的谎言，妄言这些偶像可以使他们受益，并在真主那里替他们说情。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/zh/46/27/">上一节</a><a href="/tafsir/tercume/mukhtasar/zh/46/29/">下一节</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/zh/46/29/" data-prev="/tafsir/tercume/mukhtasar/zh/46/27/"></script></body></html>

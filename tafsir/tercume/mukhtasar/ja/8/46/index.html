<!doctype html><html lang="ja" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ムフタサル — الأنفال 46 | Mushafuk.online</title><meta name="description" content="アッラーとその使徒に、言葉、行い、その他の事柄について従いなさい。そして互いに言い争ってはいけない。さもないとあなた方は弱くなり、臆病となり、脆弱化する。だから耐えなさい。アッラーは耐える人びとを援助され、支援される。そしてその人は勝利するのだ。"><meta property="og:title" content="ムフタサル — الأنفال 46 | Mushafuk.online"><meta property="og:description" content="アッラーとその使徒に、言葉、行い、その他の事柄について従いなさい。そして互いに言い争ってはいけない。さもないとあなた方は弱くなり、臆病となり、脆弱化する。だから耐えなさい。アッラーは耐える人びとを援助され、支援される。そしてその人は勝利するのだ。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/ja/8/46/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/ja/8/45/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/ja/8/47/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans JP",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/ja/" aria-label="×">×</a><div class="who"><b>الأنفال</b><small>節 46</small></div></header><main id="tf"><p class="src">ムフタサル</p><p class="ay" dir="rtl" lang="ar">وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ وَلَا تَنَـٰزَعُوا۟ فَتَفْشَلُوا۟ وَتَذْهَبَ رِيحُكُمْ ۖ وَٱصْبِرُوٓا۟ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّـٰبِرِينَ ﴿٤٦﴾</p><div class="tx" lang="ja">アッラーとその使徒に、言葉、行い、その他の事柄について従いなさい。そして互いに言い争ってはいけない。さもないとあなた方は弱くなり、臆病となり、脆弱化する。だから耐えなさい。アッラーは耐える人びとを援助され、支援される。そしてその人は勝利するのだ。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/ja/8/45/">前の節</a><a href="/tafsir/tercume/mukhtasar/ja/8/47/">次の節</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/ja/8/47/" data-prev="/tafsir/tercume/mukhtasar/ja/8/45/"></script></body></html>

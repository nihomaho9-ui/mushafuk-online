らを滅ぼした。彼らはその行いに対する報いとして、まったく不当な扱いを受けはしないのである。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/ja/10/46/">前の節</a><a href="/tafsir/tercume/mukhtasar/ja/10/48/">次の節</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/ja/10/48/" data-prev="/tafsir/tercume/mukhtasar/ja/10/46/"></script></body></html>

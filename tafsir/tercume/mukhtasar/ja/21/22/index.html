<!doctype html><html lang="ja" dir="ltr"><head><script>try{if(sessionStorage.getItem("qm.tfdir"))document.documentElement.classList.add("qm-turning")}catch(e){}</script><style>html.qm-turning body{opacity:0}</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ムフタサル — الأنبياء 22 | Mushafuk.online</title><meta name="description" content="万が一、諸天と大地に多数の崇められるべき存在がアッラー以外にいたならば、それらの王権争奪で混乱に陥っていただろう。だが、現実はそれとは異なる。よって玉座の主、アッラーは多神教徒が「かれには仲間がいる」とでっち上げる主張とは無縁なのである。"><meta property="og:title" content="ムフタサル — الأنبياء 22 | Mushafuk.online"><meta property="og:description" content="万が一、諸天と大地に多数の崇められるべき存在がアッラー以外にいたならば、それらの王権争奪で混乱に陥っていただろう。だが、現実はそれとは異なる。よって玉座の主、アッラーは多神教徒が「かれには仲間がいる」とでっち上げる主張とは無縁なのである。"><meta property="og:image" content="https://mushafuk.online/share.jpg"><link rel="canonical" href="https://mushafuk.online/tafsir/tercume/mukhtasar/ja/21/22/"><link rel="prev" href="https://mushafuk.online/tafsir/tercume/mukhtasar/ja/21/21/"><link rel="next" href="https://mushafuk.online/tafsir/tercume/mukhtasar/ja/21/23/"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/tafsir/saadi.css?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet"><style>.tx{font-family:"Noto Sans JP",sans-serif}</style></head><body><header class="bar"><a class="x" href="/tafsir/tercume/mukhtasar/ja/" aria-label="×">×</a><div class="who"><b>الأنبياء</b><small>節 22</small></div></header><main id="tf"><p class="src">ムフタサル</p><p class="ay" dir="rtl" lang="ar">لَوْ كَانَ فِيهِمَآ ءَالِهَةٌ إِلَّا ٱللَّهُ لَفَسَدَتَا ۚ فَسُبْحَـٰنَ ٱللَّهِ رَبِّ ٱلْعَرْشِ عَمَّا يَصِفُونَ ﴿٢٢﴾</p><div class="tx" lang="ja">万が一、諸天と大地に多数の崇められるべき存在がアッラー以外にいたならば、それらの王権争奪で混乱に陥っていただろう。だが、現実はそれとは異なる。よって玉座の主、アッラーは多神教徒が「かれには仲間がいる」とでっち上げる主張とは無縁なのである。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/ja/21/21/">前の節</a><a href="/tafsir/tercume/mukhtasar/ja/21/23/">次の節</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/ja/21/23/" data-prev="/tafsir/tercume/mukhtasar/ja/21/21/"></script></body></html>

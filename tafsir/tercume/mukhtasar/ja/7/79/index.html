た方に伝え、希望を与え、また恐怖も示して、助言をした。でもあなた方は、善を示し悪を避けるための証を望む助言者たちを好まない民である。</div><nav class="pn"><a href="/tafsir/tercume/mukhtasar/ja/7/78/">前の節</a><a href="/tafsir/tercume/mukhtasar/ja/7/80/">次の節</a></nav></main><script src="/tafsir/turn.js?v=4" data-next="/tafsir/tercume/mukhtasar/ja/7/80/" data-prev="/tafsir/tercume/mukhtasar/ja/7/78/"></script></body></html>
